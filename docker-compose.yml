# Full stack: bot + PostgreSQL + Redis.
#   cp .env.example .env   # fill BOT_TOKEN, CHANNEL_ID, ADMIN_IDS, POSTGRES_PASSWORD
#   docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: photobattle
      POSTGRES_USER: photobattle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    # Bound to localhost only: reachable for local development and backups, not from the internet.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photobattle -d photobattle"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # AOF persistence keeps scheduled/retrying jobs across restarts; BullMQ requires noeviction.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://photobattle:${POSTGRES_PASSWORD}@postgres:5432/photobattle?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    ports:
      - "${PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
